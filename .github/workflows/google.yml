# This workflow will build a docker container, publish it to Google Container
# Registry, and deploy it to GKE when there is a push to the "main"
# branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Google Kubernetes Engine (container.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Ensure that your repository contains the necessary configuration for your
#    Google Kubernetes Engine cluster, including deployment.yml,
#    kustomization.yml, service.yml, etc.
#
# 3. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Kubernetes Engine Developer (roles/container.developer)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources
#
# 5. Change the values in the "env" block to match your values.

name: 'Build and Deploy to GKE'

on:
  push:
    branches:
      - main

concurrency:
  group: 'gke-production-deploy'
  cancel-in-progress: false

env:
  PROJECT_ID: '${{ vars.GCP_PROJECT_ID }}' # Required repo variable: GCP_PROJECT_ID (example: my-project)
  GAR_LOCATION: '${{ vars.GAR_LOCATION }}' # Required repo variable: GAR_LOCATION (Artifact Registry region, example: us-central1)
  GKE_CLUSTER: '${{ vars.GKE_CLUSTER }}' # Required repo variable: GKE_CLUSTER (cluster name)
  GKE_ZONE: '${{ vars.GKE_LOCATION }}' # Required repo variable: GKE_LOCATION (zone or region, example: us-central1-c or us-central1)
  DEPLOYMENT_NAME: '${{ vars.GKE_DEPLOYMENT_NAME }}' # Required repo variable: GKE_DEPLOYMENT_NAME (Kubernetes deployment metadata.name)
  REPOSITORY: '${{ vars.GAR_REPOSITORY }}' # Required repo variable: GAR_REPOSITORY (Artifact Registry repository name)
  IMAGE: "${{ vars.GAR_IMAGE || 'static-site' }}" # Optional repo variable: GAR_IMAGE (defaults to static-site when unset)
  WORKLOAD_IDENTITY_PROVIDER: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}' # Required repo variable: GCP_WORKLOAD_IDENTITY_PROVIDER (projects/.../providers/...)
  SERVICE_ACCOUNT: '${{ vars.GCP_SERVICE_ACCOUNT }}' # Required repo variable: GCP_SERVICE_ACCOUNT (deployer@PROJECT_ID.iam.gserviceaccount.com)

jobs:
  setup-build-publish-deploy:
    name: 'Setup, Build, Publish, and Deploy'
    runs-on: 'ubuntu-latest'
    environment: 'production'
    timeout-minutes: 30

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - name: 'Validate required repository variables'
        run: |-
          set -euo pipefail
          for var_name in PROJECT_ID GAR_LOCATION GKE_CLUSTER GKE_ZONE DEPLOYMENT_NAME REPOSITORY WORKLOAD_IDENTITY_PROVIDER SERVICE_ACCOUNT; do
            if [[ -z "${!var_name}" ]]; then
              echo "::error::Missing required repository variable for ${var_name}. Check workflow env comments for required variable names."
              exit 1
            fi
          done

      # Configure Workload Identity Federation and generate an access token.
      #
      # See https://github.com/google-github-actions/auth for more options,
      # including authenticating via a JSON credentials file.
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'
          token_format: 'access_token'
          create_credentials_file: true

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: 'Docker Auth'
        uses: 'docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567' # docker/login-action@v3
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      # Get the GKE credentials so we can deploy to the cluster
      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@6051de21ad50fbb1767bc93c11357a49082ad116' # google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      - name: 'Set up Docker Buildx'
        uses: 'docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f' # docker/setup-buildx-action@v3

      # Build the Docker image with cache and push to Artifact Registry
      - name: 'Build and push Docker container'
        uses: 'docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8' # docker/build-push-action@v6
        with:
          context: '.'
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: 'type=gha'
          cache-to: 'type=gha,mode=max'
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF=${{ github.ref }}

      # Set up kustomize
      - name: 'Set up Kustomize'
        run: |-
          set -euo pipefail
          curl -sfLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz kustomize
          chmod u+x ./kustomize
          ./kustomize version

      # Deploy the Docker image to the GKE cluster
      - name: 'Deploy to GKE'
        run: |-
          set -euo pipefail
          IMAGE_REGISTRY="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"
          IMAGE_URI="${IMAGE_REGISTRY}:${GITHUB_SHA}"
          # replacing the image name in the k8s template
          ./kustomize edit set image "${IMAGE_REGISTRY}=${IMAGE_URI}"
          ./kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" --timeout=5m
          kubectl get services -o wide
